name: CI

# What runs when
#   - every pull request and every push to main: the quick jobs (Linux GCC with GUI, Linux Clang, sanitizers, macOS CLI);
#   - a pull request that touches gui/ or a CMakeLists.txt: also the Qt WebEngine / WebGL viewer build;
#   - main, version tags (v*) and a manual run with "full" ticked: also the slow jobs (Windows, Ubuntu 22.04, RPM, packages).
# A push to a branch that has no pull request does not start anything: open a pull request, or use "Run workflow".
#
# Switching an operating system off without editing this file: Settings > Secrets and variables > Actions > Variables, then
# create CI_MACOS, CI_WINDOWS, CI_UBUNTU22 or CI_RPM with the value "off". Note: the release job waits for those jobs, so a
# tag does not publish a release while one of them is switched off.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:        # also from the Actions page ("Run workflow")
    inputs:
      full:
        description: "Run also the slow jobs (Windows, Ubuntu 22.04, RPM, packages)"
        type: boolean
        default: false

# A new push supersedes the run in progress on the same branch; the run of a release tag is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Decides which optional jobs run. It is a few seconds long and only the optional jobs wait for it.
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.p.outputs.full }}
      webgl: ${{ steps.p.outputs.webgl }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.base_ref }}
          FULL_INPUT: ${{ inputs.full }}
        run: |
          full=false
          if [[ "$REF" == refs/tags/v* || "$REF" == refs/heads/main || "$FULL_INPUT" == "true" ]]; then full=true; fi
          webgl=$full
          if [[ "$webgl" != true && "$EVENT" == pull_request ]]; then
            if git diff --name-only "origin/$BASE...HEAD" | grep -qE '^(gui/|CMakeLists\.txt$|.*/CMakeLists\.txt$)'; then webgl=true; fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "webgl=$webgl" >> "$GITHUB_OUTPUT"
          echo "full=$full webgl=$webgl"

  linux-gui:
    name: Linux (GCC, GUI Qt6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # qt6-svg-dev: the same configuration as the packages (fingerprint figure included).
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libjson-c-dev pkg-config qt6-base-dev qt6-svg-dev libgl1-mesa-dev fonts-dejavu-core
      # The module that builds the manual: without it the test "manual up to date" is skipped, and a stale manual would
      # only be noticed by the (slow) package jobs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-manual.txt
      - name: Python module of the manual
        run: pip install -r tools/requirements-manual.txt
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-gcc-gui
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIGINT_WARNINGS_AS_ERRORS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4
        env:
          QT_QPA_PLATFORM: offscreen

  # The optional WebGL viewer (Qt WebEngine + 3Dmol.js) is not built by the other jobs, which only have qt6-base-dev.
  linux-webengine:
    name: Linux (GUI with the WebGL viewer, Qt WebEngine)
    needs: plan
    if: needs.plan.outputs.webgl == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libjson-c-dev pkg-config qt6-base-dev qt6-svg-dev qt6-webengine-dev libgl1-mesa-dev fonts-dejavu-core
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-gcc-webengine
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIGINT_WARNINGS_AS_ERRORS=ON -DLIGINT_GUI_WITH_3DMOL=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee configure.log
          # find_package is QUIET: fail here if WebEngine was not found, or this job would silently test nothing new
          grep -q "advanced 3D viewer enabled" configure.log
      - name: Build
        run: cmake --build build
      # no sandbox and no GPU: the runner has neither user namespaces for Chromium nor an OpenGL device
      - name: Test (core and GUI smoke; the Python suite runs in the other jobs)
        run: ctest --test-dir build --output-on-failure -R "core_unit|gui_smoke"
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"

  linux-clang:
    name: Linux (Clang, GUI Qt6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang libcurl4-openssl-dev libjson-c-dev pkg-config qt6-base-dev libgl1-mesa-dev fonts-dejavu-core
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-clang-gui
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DLIGINT_WARNINGS_AS_ERRORS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4
        env:
          QT_QPA_PLATFORM: offscreen

  sanitizers:
    name: Linux (ASan + UBSan, no GUI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libjson-c-dev pkg-config
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLIGINT_SANITIZE=ON -DLIGINT_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos-cli:
    name: macOS (library and CLI only)
    if: vars.CI_MACOS != 'off'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLIGINT_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------------------------
  # Installers and packages. They are built after the tests pass, tried (installed, started,
  # removed) and kept as artifacts; a version tag (v*) publishes them in a GitHub release.
  # ---------------------------------------------------------------------------------------------
  linux-packages:
    name: Linux packages (.deb, .tar.gz)
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libjson-c-dev pkg-config qt6-base-dev qt6-svg-dev libgl1-mesa-dev fonts-dejavu-core lintian desktop-file-utils
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-packages
      # No tests and no manual check here: the job "Linux (GCC, GUI Qt6)" runs them on the same configuration, and the release waits for it.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIGINT_WARNINGS_AS_ERRORS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build
      - name: Package
        run: cd build && cpack -G "DEB;TGZ"
      - name: Check the packages (lintian)
        run: lintian --fail-on error build/ligint_*_amd64.deb build/ligint-dev_*_amd64.deb
      - name: Install, run, remove
        run: |
          sudo apt-get install -y ./build/ligint_*_amd64.deb ./build/ligint-dev_*_amd64.deb
          ligint --version
          ligint tests/data/1AZM.pdb AZM --csv | head -3
          QT_QPA_PLATFORM=offscreen timeout 5 ligint-gui tests/data/1AZM.pdb || [ $? -eq 124 ]
          desktop-file-validate /usr/share/applications/ligint-gui.desktop
          # a program built against the installed development package (this catches a CMake package that names build-only targets)
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(consumer CXX)
          set(CMAKE_CXX_STANDARD 17)
          find_package(ligint REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE ligint::core)
          EOF
          cat > consumer/main.cpp <<'EOF'
          #include <iostream>
          #include <ligint/ligint.hpp>
          int main(int, char** argv) {
              ligint::Options opt;
              opt.ligName = argv[2];
              auto r = ligint::analyzeFile(argv[1], opt);
              std::cout << "ligint " << LIGINT_VERSION << ": " << r.ligands.at(0).hits.size() << " interactions\n";
          }
          EOF
          cmake -S consumer -B consumer/build
          cmake --build consumer/build
          consumer/build/consumer tests/data/1AZM.pdb AZM
          sudo apt-get remove -y ligint ligint-dev
          hash -r                       # forget the cached path of the removed program
          if command -v ligint > /dev/null; then echo "ligint is still in the PATH after removal"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/ligint_*_amd64.deb
            build/ligint-dev_*_amd64.deb
            build/ligint-*-linux-*.tar.gz

  linux-ubuntu22:
    name: Ubuntu 22.04 packages (.deb)
    needs: plan
    if: needs.plan.outputs.full == 'true' && vars.CI_UBUNTU22 != 'off'
    runs-on: ubuntu-24.04
    # Built in an Ubuntu 22.04 container, not on the runner image "ubuntu-22.04" (GitHub is retiring that label in 2027): the container
    # has the libraries of 22.04 (Qt 6.2, libcurl 7.81, glibc 2.35), so the package depends on them and installs on 22.04.
    container:
      image: ubuntu:22.04
    steps:
      - name: Prepare
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake ninja-build g++ make pkg-config libcurl4-openssl-dev libjson-c-dev \
            qt6-base-dev libqt6svg6-dev libgl1-mesa-dev fonts-dejavu-core python3 python3-pip lintian desktop-file-utils dpkg-dev file
      - name: The HTML manual is up to date with its sources
        run: |
          pip3 install -r tools/requirements-manual.txt
          python3 tools/build_manual.py --check
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIGINT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
      - name: Package
        run: cd build && cpack -G DEB
      - name: Check the packages (lintian)
        run: lintian --fail-on error build/ligint_*_amd64.deb build/ligint-dev_*_amd64.deb
      - name: Install, run, remove
        run: |
          apt-get install -y ./build/ligint_*_amd64.deb ./build/ligint-dev_*_amd64.deb
          ligint --version
          ligint tests/data/1AZM.pdb AZM --csv | head -3
          QT_QPA_PLATFORM=offscreen timeout 5 ligint-gui tests/data/1AZM.pdb || [ $? -eq 124 ]
          desktop-file-validate /usr/share/applications/ligint-gui.desktop
          # a program built against the installed development package
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(consumer CXX)
          set(CMAKE_CXX_STANDARD 17)
          find_package(ligint REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE ligint::core)
          EOF
          cat > consumer/main.cpp <<'EOF'
          #include <iostream>
          #include <ligint/ligint.hpp>
          int main(int, char** argv) {
              ligint::Options opt;
              opt.ligName = argv[2];
              auto r = ligint::analyzeFile(argv[1], opt);
              std::cout << "ligint " << LIGINT_VERSION << ": " << r.ligands.at(0).hits.size() << " interactions\n";
          }
          EOF
          cmake -S consumer -B consumer/build
          cmake --build consumer/build
          consumer/build/consumer tests/data/1AZM.pdb AZM
          apt-get remove -y ligint ligint-dev
          hash -r                       # forget the cached path of the removed program
          if command -v ligint > /dev/null; then echo "ligint is still in the PATH after removal"; exit 1; fi
      - name: Name the packages for Ubuntu 22.04
        # the same package name and version as the one for Ubuntu 24.04: the release collects all the files in one folder, so they need different names
        run: |
          cd build
          for f in ligint_*_amd64.deb ligint-dev_*_amd64.deb; do mv "$f" "${f%_amd64.deb}_ubuntu22.04_amd64.deb"; done
          ls -l ligint*_ubuntu22.04_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-ubuntu22-packages
          path: |
            build/ligint_*_ubuntu22.04_amd64.deb
            build/ligint-dev_*_ubuntu22.04_amd64.deb

  deb-clean-install:
    name: Install the .deb on a clean ${{ matrix.name }}
    # The jobs that build the packages install them in an environment that already has the development tools. A user does not: this installs the .deb
    # as a user does (with the recommended packages) on a system with nothing else, so that a missing dependency shows.
    needs: [linux-packages, linux-ubuntu22]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            image: "ubuntu:22.04"
            artifact: linux-ubuntu22-packages
          - name: Ubuntu 24.04
            image: "ubuntu:24.04"
            artifact: linux-packages
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Prepare
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: debs
      - name: Install
        run: |
          ls -l debs
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./debs/ligint_*_amd64.deb
      - name: Run
        run: |
          ligint --version
          ligint tests/data/1AZM.pdb AZM --csv | head -3
          QT_QPA_PLATFORM=offscreen timeout 5 ligint-gui tests/data/1AZM.pdb || [ $? -eq 124 ]
      - name: Remove
        run: |
          apt-get remove -y ligint
          hash -r
          if command -v ligint > /dev/null; then echo "ligint is still in the PATH after removal"; exit 1; fi

  windows:
    name: Windows (MSVC, Qt 6) installer
    needs: plan
    if: needs.plan.outputs.full == 'true' && vars.CI_WINDOWS != 'off'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          arch: win64_msvc2019_64
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        id: build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package
        run: cd build && cpack
      - name: Try the installer (silent install, run, uninstall)
        shell: pwsh
        run: |
          $installer = (Get-ChildItem build\ligint-*-win64.exe | Select-Object -First 1).FullName
          Write-Host "installer: $installer"
          Start-Process -FilePath $installer -ArgumentList '/S', '/D=C:\ligint-test' -Wait
          & 'C:\ligint-test\bin\ligint.exe' --version
          & 'C:\ligint-test\bin\ligint.exe' tests\data\1AZM.pdb AZM --csv | Select-Object -First 3
          $gui = Start-Process -FilePath 'C:\ligint-test\bin\ligint-gui.exe' -ArgumentList 'tests\data\1AZM.pdb' -PassThru
          Start-Sleep -Seconds 6
          if ($gui.HasExited) { throw "ligint-gui exited at start with code $($gui.ExitCode)" }
          $gui.Kill()
          Start-Process -FilePath 'C:\ligint-test\Uninstall.exe' -ArgumentList '/S', '_?=C:\ligint-test' -Wait
          if (Test-Path 'C:\ligint-test\bin\ligint.exe') { throw "the uninstaller left ligint.exe behind" }
      - name: Try the portable zip
        shell: pwsh
        run: |
          $zip = (Get-ChildItem build\ligint-*-win64.zip | Select-Object -First 1).FullName
          Expand-Archive -Path $zip -DestinationPath C:\ligint-zip
          $exe = (Get-ChildItem C:\ligint-zip -Recurse -Filter ligint.exe | Select-Object -First 1).FullName
          & $exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            build/ligint-*-win64.exe
            build/ligint-*-win64.zip

  # RPM for Rocky Linux / AlmaLinux / RHEL 9. It is built inside a Rocky 9 container (the binaries then link
  # against the glibc and libstdc++ of that release) and installed in a clean AlmaLinux 9 container, the way a
  # user would do it. Qt 6 comes from EPEL: if it is not available the job builds the command line only.
  rpm-rocky9:
    name: RPM (built in Rocky Linux 9)
    needs: plan
    if: needs.plan.outputs.full == 'true' && vars.CI_RPM != 'off'
    runs-on: ubuntu-24.04
    container:
      image: rockylinux:9
    steps:
      - name: Dependencies
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf install -y git gcc-c++ cmake make python3 desktop-file-utils dejavu-sans-fonts
          dnf install -y rpm-build redhat-rpm-config || dnf install -y rpm-build
          # network features (RCSB download, KLIFS service): the libcurl of RHEL 9 is 7.76, older than 7.85, which the code handles
          dnf install -y libcurl-devel json-c-devel pkgconf-pkg-config || echo "::warning::libcurl or json-c development packages not found: building without network features"
          if dnf install -y qt6-qtbase-devel qt6-qtsvg-devel mesa-libGL-devel; then
            echo "LIGINT_GUI=ON" >> "$GITHUB_ENV"
          else
            echo "::warning::Qt 6 development packages not found in the Rocky 9 and EPEL repositories: building the command line only"
            echo "LIGINT_GUI=OFF" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DLIGINT_BUILD_GUI="$LIGINT_GUI"
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
      - name: Package
        run: cd build && cpack -G RPM
      - name: Contents and dependencies of the packages
        run: |
          cd build
          for f in ligint-*.rpm; do
            echo "=== $f"
            rpm -qpi "$f" | head -12
            rpm -qpl "$f" | grep -v "/doc/ligint/img\|/doc/ligint/examples"
            echo "--- requires"
            rpm -qpR "$f"
          done
      - name: Install, run, remove
        run: |
          dnf install -y ./build/ligint-[0-9]*.rpm
          ligint --version
          ligint tests/data/1AZM.pdb AZM --csv | head -3
          if [ -x /usr/bin/ligint-gui ]; then
            QT_QPA_PLATFORM=offscreen timeout 5 ligint-gui tests/data/1AZM.pdb || [ $? -eq 124 ]
            desktop-file-validate /usr/share/applications/ligint-gui.desktop
          fi
          rpm -V ligint
          dnf remove -y ligint
          hash -r                       # forget the cached path of the removed program
          if command -v ligint > /dev/null; then echo "ligint is still in the PATH after removal"; exit 1; fi
      - name: Summary
        run: |
          {
            echo "### RPM built on Rocky Linux 9"
            echo "- GUI included: $LIGINT_GUI"
            echo "- GCC: $(gcc --version | head -1)"
            echo "- CMake: $(cmake --version | head -1)"
            ls -1 build/ligint-*.rpm | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-rocky9
          path: build/ligint-*.rpm

  rpm-alma9:
    name: RPM installed on AlmaLinux 9
    needs: rpm-rocky9
    runs-on: ubuntu-24.04
    container:
      image: almalinux:9
    steps:
      - name: Prepare
        run: dnf install -y git epel-release desktop-file-utils dejavu-sans-fonts
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rpm-rocky9
          path: rpms
      - name: Install the program (its dependencies come from the repositories)
        run: |
          dnf install -y ./rpms/ligint-[0-9]*.rpm
          ligint --version
          ligint tests/data/1AZM.pdb AZM --csv | head -3
          if [ -x /usr/bin/ligint-gui ]; then
            QT_QPA_PLATFORM=offscreen timeout 5 ligint-gui tests/data/1AZM.pdb || [ $? -eq 124 ]
            desktop-file-validate /usr/share/applications/ligint-gui.desktop
          fi
      - name: Install the development package and build a program with it
        run: |
          # ligint-devel needs the development packages of libcurl and json-c; json-c-devel is in the CodeReady Linux Builder repository (CRB).
          # Only this step enables it: the program itself must install from the default repositories (previous step).
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y gcc-c++ cmake make ./rpms/ligint-devel-*.rpm
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(consumer CXX)
          set(CMAKE_CXX_STANDARD 17)
          find_package(ligint REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE ligint::core)
          EOF
          cat > consumer/main.cpp <<'EOF'
          #include <iostream>
          #include <ligint/ligint.hpp>
          int main(int, char** argv) {
              ligint::Options opt;
              opt.ligName = argv[2];
              auto r = ligint::analyzeFile(argv[1], opt);
              std::cout << "ligint " << LIGINT_VERSION << ": " << r.ligands.at(0).hits.size() << " interactions\n";
          }
          EOF
          cmake -S consumer -B consumer/build
          cmake --build consumer/build
          consumer/build/consumer tests/data/1AZM.pdb AZM
      - name: Remove
        run: |
          dnf remove -y ligint ligint-devel
          hash -r                       # forget the cached path of the removed program
          if command -v ligint > /dev/null; then echo "ligint is still in the PATH after removal"; exit 1; fi

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-gui, linux-clang, sanitizers, macos-cli, linux-packages, linux-ubuntu22, deb-clean-install, windows, rpm-alma9]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
