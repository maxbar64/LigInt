name: CI

on:
  push:
  pull_request:
  workflow_dispatch:        # also from the Actions page ("Run workflow")

jobs:
  linux-gui:
    name: Linux (GCC, GUI Qt6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libjson-c-dev pkg-config qt6-base-dev libgl1-mesa-dev fonts-dejavu-core
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIGINT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  linux-clang:
    name: Linux (Clang, GUI Qt6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang libcurl4-openssl-dev libjson-c-dev pkg-config qt6-base-dev libgl1-mesa-dev fonts-dejavu-core
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DLIGINT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  sanitizers:
    name: Linux (ASan + UBSan, no GUI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libjson-c-dev pkg-config
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLIGINT_SANITIZE=ON -DLIGINT_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos-cli:
    name: macOS (library and CLI only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLIGINT_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------------------------
  # Installers and packages. They are built after the tests pass, tried (installed, started,
  # removed) and kept as artifacts; a version tag (v*) publishes them in a GitHub release.
  # ---------------------------------------------------------------------------------------------
  linux-packages:
    name: Linux packages (.deb, .tar.gz)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libjson-c-dev pkg-config qt6-base-dev qt6-svg-dev libgl1-mesa-dev fonts-dejavu-core lintian desktop-file-utils
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The HTML manual is up to date with its sources
        run: |
          pip install -r tools/requirements-manual.txt
          python3 tools/build_manual.py --check
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIGINT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package
        run: cd build && cpack -G "DEB;TGZ"
      - name: Check the packages (lintian)
        run: lintian --fail-on error build/ligint_*_amd64.deb build/ligint-dev_*_amd64.deb
      - name: Install, run, remove
        run: |
          sudo apt-get install -y ./build/ligint_*_amd64.deb ./build/ligint-dev_*_amd64.deb
          ligint --version
          ligint tests/data/1AZM.pdb AZM --csv | head -3
          QT_QPA_PLATFORM=offscreen timeout 5 ligint-gui tests/data/1AZM.pdb || [ $? -eq 124 ]
          desktop-file-validate /usr/share/applications/ligint-gui.desktop
          # a program built against the installed development package (this catches a CMake package that names build-only targets)
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(consumer CXX)
          set(CMAKE_CXX_STANDARD 17)
          find_package(ligint REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE ligint::core)
          EOF
          cat > consumer/main.cpp <<'EOF'
          #include <iostream>
          #include <ligint/ligint.hpp>
          int main(int, char** argv) {
              ligint::Options opt;
              opt.ligName = argv[2];
              auto r = ligint::analyzeFile(argv[1], opt);
              std::cout << "ligint " << LIGINT_VERSION << ": " << r.ligands.at(0).hits.size() << " interactions\n";
          }
          EOF
          cmake -S consumer -B consumer/build
          cmake --build consumer/build
          consumer/build/consumer tests/data/1AZM.pdb AZM
          sudo apt-get remove -y ligint ligint-dev
          hash -r                       # forget the cached path of the removed program
          if command -v ligint > /dev/null; then echo "ligint is still in the PATH after removal"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/ligint_*_amd64.deb
            build/ligint-dev_*_amd64.deb
            build/ligint-*-linux-*.tar.gz

  windows:
    name: Windows (MSVC, Qt 6) installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          arch: win64_msvc2019_64
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        id: build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package
        run: cd build && cpack
      - name: Try the installer (silent install, run, uninstall)
        shell: pwsh
        run: |
          $installer = (Get-ChildItem build\ligint-*-win64.exe | Select-Object -First 1).FullName
          Write-Host "installer: $installer"
          Start-Process -FilePath $installer -ArgumentList '/S', '/D=C:\ligint-test' -Wait
          & 'C:\ligint-test\bin\ligint.exe' --version
          & 'C:\ligint-test\bin\ligint.exe' tests\data\1AZM.pdb AZM --csv | Select-Object -First 3
          $gui = Start-Process -FilePath 'C:\ligint-test\bin\ligint-gui.exe' -ArgumentList 'tests\data\1AZM.pdb' -PassThru
          Start-Sleep -Seconds 6
          if ($gui.HasExited) { throw "ligint-gui exited at start with code $($gui.ExitCode)" }
          $gui.Kill()
          Start-Process -FilePath 'C:\ligint-test\Uninstall.exe' -ArgumentList '/S', '_?=C:\ligint-test' -Wait
          if (Test-Path 'C:\ligint-test\bin\ligint.exe') { throw "the uninstaller left ligint.exe behind" }
      - name: Try the portable zip
        shell: pwsh
        run: |
          $zip = (Get-ChildItem build\ligint-*-win64.zip | Select-Object -First 1).FullName
          Expand-Archive -Path $zip -DestinationPath C:\ligint-zip
          $exe = (Get-ChildItem C:\ligint-zip -Recurse -Filter ligint.exe | Select-Object -First 1).FullName
          & $exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            build/ligint-*-win64.exe
            build/ligint-*-win64.zip

  # RPM for Rocky Linux / AlmaLinux / RHEL 9. It is built inside a Rocky 9 container (the binaries then link
  # against the glibc and libstdc++ of that release) and installed in a clean AlmaLinux 9 container, the way a
  # user would do it. Qt 6 comes from EPEL: if it is not available the job builds the command line only.
  rpm-rocky9:
    name: RPM (built in Rocky Linux 9)
    runs-on: ubuntu-24.04
    container:
      image: rockylinux:9
    steps:
      - name: Dependencies
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf install -y git gcc-c++ cmake make python3 desktop-file-utils dejavu-sans-fonts
          dnf install -y rpm-build redhat-rpm-config || dnf install -y rpm-build
          # network features (RCSB download, KLIFS service): the libcurl of RHEL 9 is 7.76, older than 7.85, which the code handles
          dnf install -y libcurl-devel json-c-devel pkgconf-pkg-config || echo "::warning::libcurl or json-c development packages not found: building without network features"
          if dnf install -y qt6-qtbase-devel qt6-qtsvg-devel mesa-libGL-devel; then
            echo "LIGINT_GUI=ON" >> "$GITHUB_ENV"
          else
            echo "::warning::Qt 6 development packages not found in the Rocky 9 and EPEL repositories: building the command line only"
            echo "LIGINT_GUI=OFF" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DLIGINT_BUILD_GUI="$LIGINT_GUI"
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
      - name: Package
        run: cd build && cpack -G RPM
      - name: Contents and dependencies of the packages
        run: |
          cd build
          for f in ligint-*.rpm; do
            echo "=== $f"
            rpm -qpi "$f" | head -12
            rpm -qpl "$f" | grep -v "/doc/ligint/img\|/doc/ligint/examples"
            echo "--- requires"
            rpm -qpR "$f"
          done
      - name: Install, run, remove
        run: |
          dnf install -y ./build/ligint-[0-9]*.rpm
          ligint --version
          ligint tests/data/1AZM.pdb AZM --csv | head -3
          if [ -x /usr/bin/ligint-gui ]; then
            QT_QPA_PLATFORM=offscreen timeout 5 ligint-gui tests/data/1AZM.pdb || [ $? -eq 124 ]
            desktop-file-validate /usr/share/applications/ligint-gui.desktop
          fi
          rpm -V ligint
          dnf remove -y ligint
          hash -r                       # forget the cached path of the removed program
          if command -v ligint > /dev/null; then echo "ligint is still in the PATH after removal"; exit 1; fi
      - name: Summary
        run: |
          {
            echo "### RPM built on Rocky Linux 9"
            echo "- GUI included: $LIGINT_GUI"
            echo "- GCC: $(gcc --version | head -1)"
            echo "- CMake: $(cmake --version | head -1)"
            ls -1 build/ligint-*.rpm | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-rocky9
          path: build/ligint-*.rpm

  rpm-alma9:
    name: RPM installed on AlmaLinux 9
    needs: rpm-rocky9
    runs-on: ubuntu-24.04
    container:
      image: almalinux:9
    steps:
      - name: Prepare
        run: dnf install -y git epel-release desktop-file-utils dejavu-sans-fonts
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rpm-rocky9
          path: rpms
      - name: Install the program (its dependencies come from the repositories)
        run: |
          dnf install -y ./rpms/ligint-[0-9]*.rpm
          ligint --version
          ligint tests/data/1AZM.pdb AZM --csv | head -3
          if [ -x /usr/bin/ligint-gui ]; then
            QT_QPA_PLATFORM=offscreen timeout 5 ligint-gui tests/data/1AZM.pdb || [ $? -eq 124 ]
            desktop-file-validate /usr/share/applications/ligint-gui.desktop
          fi
      - name: Install the development package and build a program with it
        run: |
          dnf install -y gcc-c++ cmake make ./rpms/ligint-devel-*.rpm
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(consumer CXX)
          set(CMAKE_CXX_STANDARD 17)
          find_package(ligint REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE ligint::core)
          EOF
          cat > consumer/main.cpp <<'EOF'
          #include <iostream>
          #include <ligint/ligint.hpp>
          int main(int, char** argv) {
              ligint::Options opt;
              opt.ligName = argv[2];
              auto r = ligint::analyzeFile(argv[1], opt);
              std::cout << "ligint " << LIGINT_VERSION << ": " << r.ligands.at(0).hits.size() << " interactions\n";
          }
          EOF
          cmake -S consumer -B consumer/build
          cmake --build consumer/build
          consumer/build/consumer tests/data/1AZM.pdb AZM
      - name: Remove
        run: |
          dnf remove -y ligint ligint-devel
          hash -r                       # forget the cached path of the removed program
          if command -v ligint > /dev/null; then echo "ligint is still in the PATH after removal"; exit 1; fi

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-packages, windows, rpm-alma9]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
