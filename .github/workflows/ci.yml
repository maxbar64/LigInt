name: CI

on:
  pull_request:
  workflow_dispatch:        # also from the Actions page ("Run workflow")

env:
  BUCKET_NAME: build.moldiscovery.com      # S3 bucket of the uploaded builds (moldiscovery/upload-build)

jobs:
  # ---------------------------------------------------------------------------------------------
  # Linux and Windows builds (command line and GUI). They are built, tested, packaged, tried and
  # kept as artifacts; a version tag (v*) publishes them in a GitHub release.
  # ---------------------------------------------------------------------------------------------
  # Linux: built in the RHEL 8 image of moldiscovery (GCC from gcc-toolset-10, Qt 6 from moldiscovery/build-qt),
  # so the binaries run on RHEL 8 and on newer distributions.
  linux-rhel8:
    name: Linux (RHEL 8, GCC 10, GUI Qt6) package
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # moldiscovery/upload-build authenticates to S3 with GitHub OIDC
      contents: read
      packages: read
    container:
      image: ghcr.io/moldiscovery/rhel8:20261019
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      QT_VERSION: qt-6.5.3-3-linux
    steps:
      - name: Dependencies (via dnf)
        run: dnf -y --enablerepo=powertools install libcurl-devel json-c-devel mesa-libGL-devel dejavu-sans-fonts python3
      - name: Download Qt from releases
        uses: robinraju/release-downloader@v1.9
        with:
          repository: "moldiscovery/build-qt"
          tag: ${{ env.QT_VERSION }}
          fileName: ${{ env.QT_VERSION }}.tar.xz
          token: ${{ secrets.GH_ACCESS_TOKEN }}
      - name: Extract Qt and add it to $PATH
        run: |
          rm -rf /Qt
          tar xf ${{ env.QT_VERSION }}.tar.xz -C /
          rm ${{ env.QT_VERSION }}.tar.xz
          echo "/Qt/bin" >> $GITHUB_PATH
      - uses: actions/checkout@v4
      - name: Configure
        run: scl enable gcc-toolset-10 "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/Qt -DLIGINT_WARNINGS_AS_ERRORS=ON -DLIGINT_BUNDLE_QT=ON"
      - name: Build
        run: scl enable gcc-toolset-10 "cmake --build build -j$(nproc)"
      - name: The GUI was built
        # the GUI is optional in CMake: fail here if Qt was not found instead of shipping the command line only
        run: find build -type f -name ligint-gui -perm -u+x | grep -q .
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
      - name: Package
        run: cd build && scl enable gcc-toolset-10 "cpack -G TGZ"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-rhel8-package
          path: build/ligint-*-linux-*.tar.gz

      - name: Set package info
        shell: bash
        run: echo "PKG_NAME=$(ls -t build/ligint-*-linux-*.tar.gz | head -n 1 | xargs basename)" >> $GITHUB_ENV
      - name: Upload build
        id: upload
        if: ${{ success() }}
        uses: moldiscovery/upload-build@v1
        with:
          file: build/${{ env.PKG_NAME }}
          bucket: ${{ env.BUCKET_NAME }}
      - name: Send notification
        if: ${{ success() }}
        uses: moldiscovery/notify-build@v1
        with:
          project-name: LigInt
          platform: Linux
          download-url: ${{ steps.upload.outputs.download-url }}
          gchat-webhook: ${{ secrets.GCHAT_DEVTOOLS_WEBHOOK }}

  windows:
    name: Windows (MSVC, Qt 6) installer
    runs-on: windows-2022
    permissions:
      id-token: write        # moldiscovery/upload-build authenticates to S3 with GitHub OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The HTML manual is up to date with its sources
        run: |
          pip install -r tools/requirements-manual.txt
          python tools/build_manual.py --check
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          arch: win64_msvc2019_64
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        id: build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package
        run: cd build && cpack
      - name: Try the installer (silent install, run, uninstall)
        shell: pwsh
        run: |
          $installer = (Get-ChildItem build\ligint-*-win64.exe | Select-Object -First 1).FullName
          Write-Host "installer: $installer"
          Start-Process -FilePath $installer -ArgumentList '/S', '/D=C:\ligint-test' -Wait
          & 'C:\ligint-test\bin\ligint.exe' --version
          & 'C:\ligint-test\bin\ligint.exe' tests\data\1AZM.pdb AZM --csv | Select-Object -First 3
          $gui = Start-Process -FilePath 'C:\ligint-test\bin\ligint-gui.exe' -ArgumentList 'tests\data\1AZM.pdb' -PassThru
          Start-Sleep -Seconds 6
          if ($gui.HasExited) { throw "ligint-gui exited at start with code $($gui.ExitCode)" }
          $gui.Kill()
          Start-Process -FilePath 'C:\ligint-test\Uninstall.exe' -ArgumentList '/S', '_?=C:\ligint-test' -Wait
          if (Test-Path 'C:\ligint-test\bin\ligint.exe') { throw "the uninstaller left ligint.exe behind" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            build/ligint-*-win64.exe
            build/ligint-*-win64.zip

      - name: Set package info
        shell: bash
        run: echo "PKG_NAME=$(ls -t build/ligint-*-win64.exe | head -n 1 | xargs basename)" >> $GITHUB_ENV
      - name: Upload build
        id: upload
        if: ${{ success() }}
        uses: moldiscovery/upload-build@v1
        with:
          file: build/${{ env.PKG_NAME }}
          bucket: ${{ env.BUCKET_NAME }}
      - name: Send notification
        if: ${{ success() }}
        uses: moldiscovery/notify-build@v1
        with:
          project-name: LigInt
          platform: Windows
          download-url: ${{ steps.upload.outputs.download-url }}
          gchat-webhook: ${{ secrets.GCHAT_DEVTOOLS_WEBHOOK }}

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-rhel8, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
